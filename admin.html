<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADICALLYBLOGS - Panel de Administración</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .main-wrapper {
            width: 100%;
            max-width: 600px;
        }

        .card-style {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            border: 1px solid #eaeaea;
            width: 100%;
            margin-bottom: 20px;
            text-align: center;
        }

        .login-screen {
            display: none;
            max-width: 500px;
            margin: 100px auto;
        }
        
        .login-active .login-screen {
            display: block;
        }

        .login-active .admin-container {
            display: none;
        }

        .admin-container {
            display: block;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            color: #333;
        }
        textarea, input[type="password"], input[type="text"], input[type="file"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        textarea {
            height: 140px;
            resize: vertical;
        }
        input[type="file"] {
            background: #fafafa;
            cursor: pointer;
        }
        textarea:focus, input[type="password"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: #000000;
        }
        .auto-info {
            background: #f9f9f9;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            color: #555;
            border: 1px solid #eee;
            margin-bottom: 20px;
            text-align: left;
        }
        .auto-info span {
            font-weight: bold;
            color: #000;
        }
        .btn-publish, .btn-login, .btn-action {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }
        .btn-publish:hover, .btn-login:hover, .btn-action:hover {
            background-color: #212121;
        }
        .btn-cancel {
            background-color: #e0e0e0;
            color: #000;
            display: none;
        }
        .error-msg {
            color: red;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }
        .token-hint {
            font-size: 12px;
            color: #666;
            margin-top: 6px;
        }

        /* Lista de gestión de posts */
        .posts-manager {
            text-align: left;
        }
        .post-item-admin {
            background: #fafafa;
            border: 1px solid #eee;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .post-preview {
            font-size: 14px;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .post-meta-admin {
            font-size: 12px;
            color: #777;
        }
        .post-actions {
            display: flex;
            gap: 8px;
        }
        .btn-edit {
            background-color: #2b6cb0;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-delete {
            background-color: #c53030;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Acceso -->
    <div class="card-style login-screen" id="loginScreen">
        <h1>Acceso Restringido</h1>
        <div class="form-group">
            <label for="passwordInput">Introduce la contraseña:</label>
            <input type="password" id="passwordInput" placeholder="Contraseña secreta">
        </div>
        <div class="form-group">
            <label for="tokenInput">Token de GitHub (BlogPass):</label>
            <input type="text" id="tokenInput" placeholder="ghp_...">
            <div class="token-hint">Se guardará en tu navegador de forma segura.</div>
        </div>
        <button class="btn-login" onclick="verificarPassword()">Entrar</button>
        <div class="error-msg" id="errorMsg">Contraseña incorrecta. Inténtalo de nuevo.</div>
    </div>

    <!-- Panel de Administración y Gestor -->
    <div class="main-wrapper admin-container" id="adminContainer">
        
        <!-- Formulario de Crear / Editar -->
        <div class="card-style">
            <h1 id="form-title">Nueva Publicación</h1>
            
            <div class="auto-info">
                📅 Fecha y hora de publicación: <br>
                <span id="live-datetime">Calculando...</span>
            </div>

            <div class="form-group">
                <label for="post-content" id="label-content">¿Qué quieres publicar hoy?</label>
                <textarea id="post-content" placeholder="Escribe tu pensamiento, poema o nota mental aquí..."></textarea>
            </div>

            <div class="form-group">
                <label for="post-image">Adjuntar imagen (opcional):</label>
                <input type="file" id="post-image" accept="image/*">
                <div class="token-hint">Sube una foto en alta calidad, se mantendrá intacta.</div>
            </div>

            <button class="btn-publish" id="btn-submit" onclick="guardarPublicacion()">Publicar</button>
            <button class="btn-action btn-cancel" id="btn-cancel" onclick="cancelarEdicion()">Cancelar Edición</button>
            <button class="btn-action" onclick="cerrarSesion()" style="background-color: #f1f1f1; color: #000; font-size: 14px; padding: 10px; margin-top: 15px;">Cerrar Sesión / Cambiar Token</button>
        </div>

        <!-- Lista para Gestionar Posts Existentes -->
        <div class="card-style posts-manager">
            <h1>Gestionar Publicaciones Existentes</h1>
            <div id="posts-container">
                <p style="color: #666; font-size: 14px; text-align: center;">Cargando publicaciones...</p>
            </div>
        </div>

    </div>

    <script>
        document.body.classList.add('login-active');
        document.getElementById('passwordInput').focus();

        let postsCache = [];
        let editandoIndex = null; 
        const repo = "radicallyblogs/radicallyblogs";
        const path = "posts.json";

        function decodeBase64Utf8(base64Str) {
            const binString = atob(base64Str);
            const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
            return new TextDecoder().decode(bytes);
        }

        // Convertir archivo de imagen a Base64 puro para enviarlo a GitHub
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        window.onload = function() {
            const savedToken = localStorage.getItem('gh_blog_token');
            if (savedToken) {
                document.getElementById('tokenInput').value = savedToken;
            }
        };

        function verificarPassword() {
            const pass = document.getElementById('passwordInput').value;
            const tokenVal = document.getElementById('tokenInput').value.trim();

            if (pass === 'HURACAN') {
                if (!tokenVal) {
                    alert('Por favor, introduce tu Token de GitHub.');
                    return;
                }
                localStorage.setItem('gh_blog_token', tokenVal);

                document.getElementById('loginScreen').style.display = 'none';
                document.body.classList.remove('login-active');
                actualizarFechaHora();
                cargarPostsGitHub();
            } else {
                const errorMsg = document.getElementById('errorMsg');
                errorMsg.style.display = 'block';
                document.getElementById('passwordInput').select();
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('gh_blog_token');
            location.reload();
        }

        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verificarPassword();
            }
        });

        function actualizarFechaHora() {
            const ahora = new Date();
            const opcionesFecha = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
            let fechaStr = ahora.toLocaleDateString('es-ES', opcionesFecha);
            let horaStr = ahora.toLocaleTimeString('es-ES', { hour: 'numeric', minute: '2-digit', hour12: true }).toLowerCase();
            document.getElementById('live-datetime').innerText = `${fechaStr} • ${horaStr}`;
        }

        async function cargarPostsGitHub() {
            const token = localStorage.getItem('gh_blog_token');
            const container = document.getElementById('posts-container');

            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    headers: { "Authorization": `token ${token}` }
                });

                if (!res.ok) {
                    container.innerHTML = '<p style="color: red; font-size: 14px;">Error al cargar los posts. Token inválido o sin permisos.</p>';
                    return;
                }

                const data = await res.json();
                if (data.content) {
                    postsCache = JSON.parse(decodeBase64Utf8(data.content));
                } else {
                    postsCache = [];
                }

                renderizarListaAdmin();
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p style="color: red; font-size: 14px;">Error de conexión con la API.</p>';
            }
        }

        function renderizarListaAdmin() {
            const container = document.getElementById('posts-container');
            if (postsCache.length === 0) {
                container.innerHTML = '<p style="color: #666; font-size: 14px; text-align: center;">No hay publicaciones todavía.</p>';
                return;
            }

            let html = '';
            postsCache.forEach((post, index) => {
                let imgIndicator = post.imagen ? ' 🖼️ [Con imagen]' : '';
                html += `
                    <div class="post-item-admin">
                        <div class="post-meta-admin">📅 ${post.fechaCortas || 'Sin fecha'} • ${post.hora || ''}${imgIndicator}</div>
                        <div class="post-preview">"${post.texto}"</div>
                        <div class="post-actions">
                            <button class="btn-edit" onclick="prepararEdicion(${index})">Editar</button>
                            <button class="btn-delete" onclick="borrarPost(${index})">Borrar</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function prepararEdicion(index) {
            editandoIndex = index;
            const post = postsCache[index];
            document.getElementById('post-content').value = post.texto;
            document.getElementById('post-image').value = ""; // Limpiar input file
            document.getElementById('form-title').innerText = "Editar Publicación";
            document.getElementById('btn-submit').innerText = "Guardar Cambios";
            document.getElementById('btn-cancel').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('post-content').focus();
        }

        function cancelarEdicion() {
            editandoIndex = null;
            document.getElementById('post-content').value = "";
            document.getElementById('post-image').value = "";
            document.getElementById('form-title').innerText = "Nueva Publicación";
            document.getElementById('btn-submit').innerText = "Publicar";
            document.getElementById('btn-cancel').style.display = "none";
        }

        async function guardarPublicacion() {
            const texto = document.getElementById('post-content').value;
            const imageInput = document.getElementById('post-image');
            
            if (!texto.trim() && imageInput.files.length === 0) {
                alert('Por favor, escribe algo o añade una imagen.');
                return;
            }

            const token = localStorage.getItem('gh_blog_token');
            if (!token) {
                alert('Falta el token. Vuelve a iniciar sesión.');
                return;
            }

            const ahora = new Date();
            const fechaLargaActual = ahora.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
            const fechaCortasActual = now = ahora.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
            const horaStr = ahora.toLocaleTimeString('es-ES', { hour: 'numeric', minute: '2-digit', hour12: true }).toLowerCase();

            try {
                // 1. Subir la imagen a GitHub si el usuario ha seleccionado una
                let imageName = editandoIndex !== null ? (postsCache[editandoIndex].imagen || "") : "";

                if (imageInput.files.length > 0) {
                    const file = imageInput.files[0];
                    const extension = file.name.split('.').pop();
                    imageName = `post_img_${Date.now()}.${extension}`;
                    const base64Image = await fileToBase64(file);

                    const imgRes = await fetch(`https://api.github.com/repos/${repo}/contents/${imageName}`, {
                        method: "PUT",
                        headers: {
                            "Authorization": `token ${token}`,
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            message: "Subir imagen de post",
                            content: base64Image
                        })
                    });

                    if (!imgRes.ok) {
                        alert("Error al subir la imagen a GitHub.");
                        return;
                    }
                }

                // 2. Obtener SHA actual del posts.json
                const getRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    headers: { "Authorization": `token ${token}` }
                });
                if (!getRes.ok) {
                    alert("Error al conectar con GitHub.");
                    return;
                }
                const getData = await getRes.json();
                const sha = getData.sha;

                if (getData.content) {
                    postsCache = JSON.parse(decodeBase64Utf8(getData.content));
                }

                if (editandoIndex !== null) {
                    postsCache[editandoIndex].texto = texto;
                    postsCache[editandoIndex].imagen = imageName; // Actualiza o mantiene la imagen
                } else {
                    const nuevoPost = {
                        "texto": texto,
                        "imagen": imageName,
                        "fechaLarga": fechaLargaActual,
                        "fechaCortas": fechaCortasActual,
                        "hora": horaStr
                    };
                    postsCache.unshift(nuevoPost);
                }

                // 3. Enviar posts.json actualizado a GitHub
                const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        message: editandoIndex !== null ? "Editar post desde panel" : "Nuevo post desde panel",
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(postsCache, null, 2)))),
                        sha: sha
                    })
                });

                if (putRes.ok) {
                    alert(editandoIndex !== null ? "¡Cambios guardados con éxito!" : "¡Publicado con éxito en tu blog!");
                    cancelarEdicion();
                    cargarPostsGitHub();
                } else {
                    alert("Hubo un error al guardar el JSON en GitHub.");
                }

            } catch (error) {
                console.error("Error:", error);
                alert("Error en la petición con la API.");
            }
        }

        async function borrarPost(index) {
            if (!confirm("¿Estás seguro de que quieres borrar esta publicación?")) {
                return;
            }

            const token = localStorage.getItem('gh_blog_token');
            try {
                const getRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    headers: { "Authorization": `token ${token}` }
                });
                if (!getRes.ok) {
                    alert("Error al conectar con GitHub.");
                    return;
                }
                const getData = await getRes.json();
                const sha = getData.sha;

                if (getData.content) {
                    postsCache = JSON.parse(decodeBase64Utf8(getData.content));
                }

                postsCache.splice(index, 1);

                const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        message: "Borrar post desde panel admin",
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(postsCache, null, 2)))),
                        sha: sha
                    })
                });

                if (putRes.ok) {
                    alert("¡Publicación borrada con éxito!");
                    cancelarEdicion();
                    cargarPostsGitHub();
                } else {
                    alert("Hubo un error al borrar en GitHub.");
                }

            } catch (error) {
                console.error("Error:", error);
                alert("Error al procesar el borrado.");
            }
        }
    </script>

</body>
</html>
