<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADICALLYBLOGS - Panel de Administración</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card-style {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .login-screen {
            display: none;
        }
        
        .login-active .login-screen {
            display: block;
        }

        .admin-container {
            display: none;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            border-bottom: 2px solid #000;
            padding-bottom: 12px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            color: #333;
        }
        textarea, input[type="password"], input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        textarea {
            height: 160px;
            resize: vertical;
        }
        textarea:focus, input[type="password"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: #000000;
        }
        .auto-info {
            background: #f9f9f9;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            color: #555;
            border: 1px solid #eee;
            margin-bottom: 24px;
            text-align: left;
        }
        .auto-info span {
            font-weight: bold;
            color: #000;
        }
        input[type="file"] {
            font-size: 15px;
            margin-top: 8px;
            width: 100%;
        }
        .btn-publish, .btn-login {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 15px;
        }
        .btn-publish:hover, .btn-login:hover {
            background-color: #212121;
        }
        .btn-publish:active, .btn-login:active {
             transform: scale(0.98);
        }
        .error-msg {
            color: red;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }
        .token-hint {
            font-size: 12px;
            color: #666;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Acceso con contraseña y Token dinámico -->
    <div class="card-style login-screen" id="loginScreen">
        <h1>Acceso Restringido</h1>
        <div class="form-group">
            <label for="passwordInput">Introduce la contraseña:</label>
            <input type="password" id="passwordInput" placeholder="Contraseña secreta">
        </div>
        <div class="form-group">
            <label for="tokenInput">Token de GitHub (Solo la 1ª vez):</label>
            <input type="text" id="tokenInput" placeholder="ghp_...">
            <div class="token-hint">Se guardará en tu navegador para que no tengas que ponerlo más.</div>
        </div>
        <button class="btn-login" onclick="verificarPassword()">Entrar</button>
        <div class="error-msg" id="errorMsg">Contraseña incorrecta. Inténtalo de nuevo.</div>
    </div>

    <!-- Panel de Administración -->
    <div class="card-style admin-container" id="adminContainer">
        <h1>Nueva Publicación</h1>
        
        <div class="auto-info">
            📅 Fecha y hora de publicación (Automática): <br>
            <span id="live-datetime">Calculando...</span>
        </div>

        <div class="form-group">
            <label for="post-content">¿Qué quieres publicar hoy?</label>
            <textarea id="post-content" placeholder="Escribe tu pensamiento, poema o nota mental aquí..."></textarea>
        </div>

        <div class="form-group" style="display:none;">
            <!-- Opcional de ficheros reservado -->
            <input type="file" id="media-file" accept="image/*,video/*">
        </div>

        <button class="btn-publish" onclick="crearPublicacion()">Publicar</button>
        <button class="btn-login" onclick="cerrarSesion()" style="background-color: #f1f1f1; color: #000; margin-top: 10px; font-size: 14px; padding: 12px;">Cambiar Token / Salir</button>
    </div>

    <script>
        document.body.classList.add('login-active');
        document.getElementById('passwordInput').focus();

        window.onload = function() {
            const savedToken = localStorage.getItem('gh_blog_token');
            if (savedToken) {
                document.getElementById('tokenInput').value = savedToken;
            }
        };

        function verificarPassword() {
            const pass = document.getElementById('passwordInput').value;
            const tokenVal = document.getElementById('tokenInput').value.trim();

            if (pass === 'HURACAN') {
                if (!tokenVal) {
                    alert('Por favor, introduce tu Token de GitHub al menos esta primera vez.');
                    return;
                }
                localStorage.setItem('gh_blog_token', tokenVal);

                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminContainer').style.display = 'block';
                document.body.classList.remove('login-active');
                actualizarFechaHora();
                document.getElementById('post-content').focus();
            } else {
                const errorMsg = document.getElementById('errorMsg');
                errorMsg.style.display = 'block';
                document.getElementById('passwordInput').select();
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('gh_blog_token');
            location.reload();
        }

        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verificarPassword();
            }
        });

        function actualizarFechaHora() {
            const ahora = new Date();
            const opcionesFecha = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
            let fechaStr = ahora.toLocaleDateString('es-ES', opcionesFecha);
            let horaStr = ahora.toLocaleTimeString('es-ES', { hour: 'numeric', minute: '2-digit', hour12: true }).toLowerCase();
            document.getElementById('live-datetime').innerText = `${fechaStr} • ${horaStr}`;
        }

        async function crearPublicacion() {
            const texto = document.getElementById('post-content').value;
            if (!texto.trim()) {
                alert('Por favor, escribe algo antes de publicar.');
                return;
            }

            const token = localStorage.getItem('gh_blog_token');
            const repo = "radicallyblogs/radicallyblogs";
            const path = "posts.json";

            if (!token) {
                alert('No se encuentra el token de GitHub. Por favor, vuelve a iniciar sesión.');
                location.reload();
                return;
            }

            const ahora = new Date();
            const fechaLargaActual = ahora.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
            const fechaCortasActual = ahora.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
            const horaStr = ahora.toLocaleTimeString('es-ES', { hour: 'numeric', minute: '2-digit', hour12: true }).toLowerCase();

            const nuevoPost = {
                "texto": texto,
                "fechaLarga": fechaLargaActual,
                "fechaCortas": fechaCortasActual,
                "hora": horaStr
            };

            try {
                const getRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    headers: { "Authorization": `token ${token}` }
                });

                if (!getRes.ok) {
                    alert("Error: El token de GitHub no es válido o ha expirado.");
                    return;
                }

                const getData = await getRes.json();
                const sha = getData.sha;
                
                let posts = [];
                if (getData.content) {
                    posts = JSON.parse(atob(getData.content));
                }

                posts.unshift(nuevoPost);

                const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        message: "Nuevo post desde el panel admin",
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(posts, null, 2)))),
                        sha: sha
                    })
                });

                if (putRes.ok) {
                    alert("¡Publicado con éxito en tu blog!");
                    document.getElementById('post-content').value = "";
                    actualizarFechaHora();
                } else {
                    alert("Hubo un error al conectar con GitHub.");
                }

            } catch (error) {
                console.error("Error:", error);
                alert("Error en la petición con la API.");
            }
        }
    </script>

</body>
</html>
