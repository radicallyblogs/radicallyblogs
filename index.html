<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADICALLYBLOGS</title>
    <!-- v=6 para aplicar las fuentes y tamaños exactos de Wix -->
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

    <div class="feed-container">
        <h2 class="feed-title">Actualidad</h2>

        <!-- Aquí se cargarán automáticamente los posts desde el archivo posts.json -->
        <div id="feed-posts"></div>
    </div>

    <!-- Lightbox / Pop-up de Imagen -->
    <div id="imageLightbox" class="lightbox-overlay" onclick="cerrarLightboxAlFondo(event)">
        <span class="lightbox-close" onclick="cerrarLightbox()">&times;</span>
        <img class="lightbox-img" id="lightboxImg">
    </div>

    <!-- Script para leer el posts.json y pintar el feed -->
    <script>
    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const response = await fetch('posts.json?t=' + new Date().getTime());
            const posts = await response.json();
            const container = document.getElementById('feed-posts');
            
            container.innerHTML = '';

            // Función para limpiar formato de hora ("p. m." a "pm")
            function limpiarHora(hora) {
                if (!hora) return '';
                return hora.replace(/p\.\s*m\./gi, 'pm').replace(/a\.\s*m\./gi, 'am').trim();
            }

            // Función para cambiar la coma por punto en fechas clásicas
            function limpiarFecha(fecha) {
                if (!fecha) return '';
                return fecha.replace(',', '.');
            }

            posts.forEach(post => {
                let postHTML = '';
                const horaLimpia = limpiarHora(post.hora);

                // ==========================================
                // 1. PHOTO BLOGGY
                // ==========================================
                if (post.tipo === 'photo_bloggy') {
                    const imagenUrl = (post.imagenes && post.imagenes.length > 0) ? post.imagenes[0] : post.imagen;
                    
                    const textoCaption = post.texto 
                        ? `<p class="pb-caption"><span class="pb-user-inferior">@felipeortegareyes</span>${post.texto}</p>` 
                        : '';

                    let fechaPhoto = post.fechaCortas || '';
                    const diasMap = {
                        'lun': 'lunes.',
                        'mar': 'martes.',
                        'mié': 'miércoles.',
                        'mie': 'miércoles.',
                        'jue': 'jueves.',
                        'vie': 'viernes.',
                        'sáb': 'sábado.',
                        'sab': 'sábado.',
                        'dom': 'domingo.'
                    };
                    
                    let parts = fechaPhoto.split(',');
                    if (parts.length >= 2) {
                        let cortoDia = parts[0].trim().toLowerCase();
                        let restoFecha = parts.slice(1).join(',').trim();
                        if (diasMap[cortoDia]) {
                            fechaPhoto = `${diasMap[cortoDia]} ${restoFecha}`;
                        }
                    }

                    postHTML = `
                        <article class="photo-bloggy-post">
                            <div class="pb-header-wix">
                                <div class="avatar"></div>
                                <div class="pb-text-container">
                                    <span class="pb-username">@felipeortegareyes</span>
                                    <span class="pb-datetime">${fechaPhoto} • ${horaLimpia}</span>
                                </div>
                            </div>
                            <div class="pb-image-container">
                                <img src="${imagenUrl}" alt="Photo Bloggy" onclick="abrirLightbox('${imagenUrl}')">
                            </div>
                            <div class="pb-meta-icons">
    <span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>vistas
    </span>
    <span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>GMT/europe
    </span>
    <span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>MacOs
    </span>
</div>
                                ${textoCaption}
                            </div>
                        </article>
                    `;
                } 
                // ==========================================
                // 2. BLOGGY CLÁSICO
                // ==========================================
                else {
                    let imagenHTML = '';

                    if (post.imagenes && post.imagenes.length > 0) {
                        if (post.imagenes.length === 1) {
                            const img = post.imagenes[0];
                            imagenHTML = `<div class="post-single-image-container"><img src="${img}" class="post-uploaded-img" onclick="abrirLightbox('${img}')"></div>`;
                        } else {
                            let imgsString = '';
                            post.imagenes.forEach(img => {
                                imgsString += `<div class="post-image-container"><img src="${img}" class="post-uploaded-img" onclick="abrirLightbox('${img}')"></div>`;
                            });
                            imagenHTML = `<div class="post-images-grid">${imgsString}</div>`;
                        }
                    } else if (post.imagen) {
                        imagenHTML = `<div class="post-single-image-container"><img src="${post.imagen}" class="post-uploaded-img" onclick="abrirLightbox('${post.imagen}')"></div>`;
                    }

                    const fechaLargaLimpia = limpiarFecha(post.fechaLarga);
                    const fechaCortasLimpia = limpiarFecha(post.fechaCortas);

                    postHTML = `
                        <div class="post">
                            <div class="post-date">
                                <span class="desktop-date">${fechaLargaLimpia}</span>
                                <span class="mobile-date">${fechaCortasLimpia}</span>
                            </div>
                            <div class="post-header">
                                <div class="avatar"></div>
                                <div class="user-info">
                                    <span class="username">@felipeortegareyes</span>
                                    <span class="timestamp">• ${horaLimpia}</span>
                                </div>
                            </div>
                            <div class="post-content">${post.texto || ''}</div>
                            ${imagenHTML}
                        </div>
                    `;
                }

                container.innerHTML += postHTML;
            });
        } catch (error) {
            console.error("Error al cargar los posts:", error);
        }
    });

    function abrirLightbox(src) {
        const lightbox = document.getElementById('imageLightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        lightboxImg.src = src;
        lightbox.classList.add('active');
    }

    function cerrarLightbox() {
        const lightbox = document.getElementById('imageLightbox');
        lightbox.classList.remove('active');
    }

    function cerrarLightboxAlFondo(event) {
        if (event.target.id === 'imageLightbox') {
            cerrarLightbox();
        }
    }
</script>
</body>
</html>
