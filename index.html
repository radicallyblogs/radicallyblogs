<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADICALLYBLOGS</title>
    <!-- v=6 para aplicar las fuentes y tamaños exactos de Wix -->
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

    <div class="feed-container">
        <h2 class="feed-title">Actualidad</h2>

        <!-- Aquí se cargarán automáticamente los posts desde el archivo posts.json -->
        <div id="feed-posts"></div>
    </div>

    <!-- Script para leer el posts.json y pintar el feed -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                // Se añade ?t= + timestamp para evitar que el navegador guarde en caché el JSON antiguo
                const response = await fetch('posts.json?t=' + new Date().getTime());
                const posts = await response.json();
                const container = document.getElementById('feed-posts');
                
                container.innerHTML = ''; // Limpiar contenedor

                posts.forEach(post => {
                    // Si el post tiene imagen, creamos su etiqueta HTML correspondiente
                    const imagenHTML = post.imagen ? `<div class="post-image-container"><img src="${post.imagen}" class="post-uploaded-img"></div>` : '';

                    const postHTML = `
                        <div class="post">
                            <div class="post-date">
                                <span class="desktop-date">${post.fechaLarga}</span>
                                <span class="mobile-date">${post.fechaCortas}</span>
                            </div>
                            <div class="post-header">
                                <div class="avatar"></div>
                                <div class="user-info">
                                    <span class="username">@felipeortegareyes</span>
                                    <span class="timestamp">• ${post.hora}</span>
                                </div>
                            </div>
                            <div class="post-content">${post.texto}</div>
                            ${imagenHTML}
                        </div>
                    `;
                    container.innerHTML += postHTML;
                });
            } catch (error) {
                console.error("Error al cargar los posts:", error);
            }
        });
    </script>
</body>
</html>
