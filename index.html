<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADICALLYBLOGS</title>
    <!-- v=6 para aplicar las fuentes y tamaños exactos de Wix -->
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

    <div class="feed-container">
        <h2 class="feed-title">Actualidad</h2>

        <!-- Aquí se cargarán automáticamente los posts desde el archivo posts.json -->
        <div id="feed-posts"></div>
    </div>

    <!-- Lightbox / Pop-up de Imagen -->
    <div id="imageLightbox" class="lightbox-overlay" onclick="cerrarLightboxAlFondo(event)">
        <span class="lightbox-close" onclick="cerrarLightbox()">&times;</span>
        <img class="lightbox-img" id="lightboxImg">
    </div>

    <!-- Script para leer el posts.json y pintar el feed -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                // Se añade ?t= + timestamp para evitar que el navegador guarde en caché el JSON antiguo
                const response = await fetch('posts.json?t=' + new Date().getTime());
                const posts = await response.json();
                const container = document.getElementById('feed-posts');
                
                container.innerHTML = ''; // Limpiar contenedor

                posts.forEach(post => {
                    // Si el post tiene imagen, añadimos el evento onclick para abrir el lightbox
                    const imagenHTML = post.imagen ? `<div class="post-image-container"><img src="${post.imagen}" class="post-uploaded-img" onclick="abrirLightbox('${post.imagen}')"></div>` : '';

                    const postHTML = `
                        <div class="post">
                            <div class="post-date">
                                <span class="desktop-date">${post.fechaLarga}</span>
                                <span class="mobile-date">${post.fechaCortas}</span>
                            </div>
                            <div class="post-header">
                                <div class="avatar"></div>
                                <div class="user-info">
                                    <span class="username">@felipeortegareyes</span>
                                    <span class="timestamp">• ${post.hora}</span>
                                </div>
                            </div>
                            <div class="post-content">${post.texto}</div>
                            ${imagenHTML}
                        </div>
                    `;
                    container.innerHTML += postHTML;
                });
            } catch (error) {
                console.error("Error al cargar los posts:", error);
            }
        });

        // Funciones para el control del Pop-up / Lightbox
        function abrirLightbox(src) {
            const lightbox = document.getElementById('imageLightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            lightboxImg.src = src;
            lightbox.classList.add('active');
        }

        function cerrarLightbox() {
            const lightbox = document.getElementById('imageLightbox');
            lightbox.classList.remove('active');
        }

        function cerrarLightboxAlFondo(event) {
            // Cierra únicamente si el clic se hace en el fondo oscuro y no sobre la imagen
            if (event.target.id === 'imageLightbox') {
                cerrarLightbox();
            }
        }
    </script>
</body>
</html>
