<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADICALLYBLOGS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="feed-container">
        <!-- Fecha independiente: se ve larga en PC y corta en móvil -->
        <div class="date-divider">
            <span class="desktop-date">lun. 3 de agosto de 2026</span>
            <span class="mobile-date">lun. 3 ago 2026</span>
        </div>

        <!-- Tarjeta de la Publicación -->
        <div class="bloggy-card">
            <div class="bloggy-header">
                <div class="avatar"></div>
                <div class="user-info">
                    <span class="username">@felipeortegareyes</span>
                    <span class="timestamp">• 9:59 a. m.</span>
                </div>
            </div>
            <p class="bloggy-content">¡Bienvenido a mi espacio! Este es el diseño limpio y minimalista con fondo blanco, mi foto de perfil real y las fechas adaptadas independientemente a cada pantalla.</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
